/* ============ FIELD NOTES ============ */
.field-notes {
  padding: 140px 0 120px;
  position: relative;
  background:
    radial-gradient(900px 500px at 12% 10%, rgba(212,162,86,0.06), transparent 60%),
    var(--bg);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.field-notes .section-head {
  margin-bottom: 72px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 40px; flex-wrap: wrap;
}
.field-notes .fn-intro {
  max-width: 58ch;
}
.field-notes .fn-intro .h-1 {
  margin-top: 14px;
}
.field-notes .fn-intro .lede {
  margin-top: 22px;
}
.fn-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
}
.fn-item {
  grid-column: span 4;
  padding: 44px 32px 48px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
  transition: background .5s var(--ease);
}
.fn-item:nth-child(3n) { border-right: none; }
.fn-item:hover {
  background: rgba(212,162,86,0.04);
}
.fn-item:hover .fn-num {
  color: var(--accent);
  transform: translateX(4px);
}
.fn-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 56px;
  color: var(--fg-3);
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 18px;
  display: flex; align-items: baseline; gap: 10px;
  transition: color .4s var(--ease), transform .4s var(--ease);
}
.fn-num .hash {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--fg-3);
  font-weight: 500;
  text-transform: uppercase;
}
.fn-lesson {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-bottom: 14px;
  text-wrap: pretty;
}
.fn-lesson em {
  font-style: italic;
  color: var(--accent-2);
}
.fn-story {
  color: var(--fg-2);
  font-size: 14.5px;
  line-height: 1.65;
  max-width: 36ch;
}
.fn-tag {
  display: inline-block;
  margin-top: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 4px 10px;
  border: 1px solid var(--line-2);
  border-radius: 100px;
}

html[data-surface="glass"] .fn-item:hover {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px) saturate(140%);
}

/* ============ LIQUID METAL SURFACE ============ */
html[data-surface="liquid"] {
  --line: rgba(255,255,255,0.10);
  --line-2: rgba(255,255,255,0.18);
  --shadow-1: 0 2px 4px rgba(0,0,0,.6), 0 24px 60px rgba(0,0,0,.55);
  --metal-dark: #0b0c0e;
  --metal-mid: #1a1d22;
  --metal-hi: #3a4049;
  --metal-shine: rgba(220,230,240,0.18);
  --metal-accent: rgba(220,180,120,0.20);
}
/* Ambient mercury backdrop — body receives a slow-drifting conic wash */
html[data-surface="liquid"] body::before {
  content: '';
  position: fixed; inset: -25%;
  z-index: 0; pointer-events: none;
  background:
    conic-gradient(
      from 0deg at 50% 50%,
      #0a0b0d 0deg,
      #1a1f26 55deg,
      #2c333c 110deg,
      #14181e 165deg,
      #0d1014 220deg,
      #242a34 285deg,
      #0a0b0d 360deg
    );
  filter: blur(140px) saturate(1.15);
  opacity: 0.55;
  animation: metal-drift 45s linear infinite;
  mix-blend-mode: screen;
}
html[data-surface="liquid"] body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(800px 500px at 15% 110%, rgba(212,162,86,0.08), transparent 60%),
    radial-gradient(900px 600px at 85% -10%, rgba(140,170,210,0.06), transparent 65%);
}
@keyframes metal-drift {
  to { transform: rotate(360deg); }
}

/* Nav: brushed chrome with top highlight */
html[data-surface="liquid"] .nav {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0) 40%),
    linear-gradient(180deg, rgba(22,24,28,0.88) 0%, rgba(12,14,17,0.92) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.10);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.4),
    0 8px 28px rgba(0,0,0,0.5);
}

/* Toggle chips + hero meta — obsidian pills with specular edge */
html[data-surface="liquid"] .nav-resume,
html[data-surface="liquid"] .theme-toggle,
html[data-surface="liquid"] .hero-location,
html[data-surface="liquid"] .hero-meta .pill,
html[data-surface="liquid"] .hero-disciplines {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(180deg, rgba(36,40,48,0.75) 0%, rgba(16,18,22,0.85) 100%);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.16),
    inset 0 -1px 0 rgba(0,0,0,0.5);
}

/* Primary button: polished gold-on-steel plate */
html[data-surface="liquid"] .btn-primary,
html[data-surface="liquid"] .nav-cta-book {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 40%),
    linear-gradient(180deg, #e6c17a 0%, #b8893f 100%);
  border: 1px solid rgba(180,130,45,0.6);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    inset 0 -2px 4px rgba(80,40,10,0.35),
    0 14px 40px rgba(180,130,45,0.35),
    0 2px 6px rgba(0,0,0,0.45);

  text-shadow: 0 1px 0 rgba(255,235,200,0.5);

}
html[data-surface="liquid"] .btn-primary::before,
html[data-surface="liquid"] .nav-cta-book::before {
  content: '';
  position: absolute; inset: 0;

/* Cards: deep obsidian with mercury sheen on top edge */

    );

html[data-theme="light"][data-surface="liquid"] .nav {

/* ============ AI TWIN ============ */
.ai-twin {
  padding: 140px 0 130px;
  position: relative;
  background:
    radial-gradient(1000px 600px at 85% 20%, rgba(212,162,86,0.08), transparent 60%),
    radial-gradient(700px 400px at 10% 90%, rgba(232,192,125,0.05), transparent 60%),
    var(--bg);
  overflow: hidden;
}
.ai-twin::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(212,162,86,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,162,86,0.04) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 70% 50% at 60% 50%, #000 40%, transparent 75%);
  pointer-events: none;
  opacity: 0.6;
}
.ai-twin .container { position: relative; }
.twin-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 40px; flex-wrap: wrap; margin-bottom: 48px;
}
.twin-intro {
  max-width: 56ch;
}
.twin-intro .h-1 { margin-top: 14px; }
.twin-intro .lede { margin-top: 22px; }
.twin-status {
  display: flex; align-items: center; gap: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.twin-status .live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #5ecf89;
  box-shadow: 0 0 12px #5ecf89, 0 0 4px #5ecf89;
  animation: twin-pulse 2s ease-in-out infinite;
}
@keyframes twin-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
.twin-panel {
  background: linear-gradient(180deg, rgba(20,18,16,0.92), rgba(12,10,8,0.96));
  border: 1px solid rgba(212,162,86,0.22);
  border-radius: 24px;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.06);
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 2fr;
  min-height: 560px;
}
html[data-theme="light"] .twin-panel {
  background: linear-gradient(180deg, #ffffff, #fafafa);
  border: 1px solid rgba(0,0,0,0.08);
  box-shadow:
    0 40px 100px rgba(0,0,0,0.08),
    inset 0 1px 0 rgba(255,255,255,0.8);
}
.twin-side {
  padding: 36px 32px;
  border-right: 1px solid rgba(212,162,86,0.15);
  display: flex; flex-direction: column; gap: 28px;
  background: linear-gradient(180deg, rgba(212,162,86,0.04), transparent);
}
html[data-theme="light"] .twin-side {
  border-right-color: rgba(0,0,0,0.08);
}
.twin-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, rgba(232,192,125,0.9), rgba(180,130,60,0.7)),
    #2a2018;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 28px; font-weight: 400;
  color: #1a0f06;
  box-shadow:
    0 0 0 1px rgba(212,162,86,0.3),
    0 0 40px rgba(212,162,86,0.25),
    inset 0 2px 8px rgba(255,220,170,0.4);
  position: relative;
}
.twin-avatar::after {
  content: '';
  position: absolute;
  bottom: 2px; right: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #5ecf89;
  border: 3px solid #0c0a08;
}
html[data-theme="light"] .twin-avatar::after { border-color: #fff; }
.twin-meta .name {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-bottom: 4px;
}
.twin-meta .role {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-2);
}
.twin-bio {
  color: var(--fg-2);
  font-size: 14px;
  line-height: 1.6;
  border-top: 1px solid rgba(212,162,86,0.12);
  padding-top: 20px;
}
html[data-theme="light"] .twin-bio { border-top-color: rgba(0,0,0,0.06); }
.twin-suggestions-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 12px;
}
.twin-suggestions {
  display: flex; flex-direction: column; gap: 8px;
}
.twin-suggestions button {
  text-align: left;
  padding: 11px 14px;
  background: rgba(212,162,86,0.06);
  border: 1px solid rgba(212,162,86,0.18);
  border-radius: 12px;
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  line-height: 1.4;
  cursor: pointer;
  transition: all .25s var(--ease);
  letter-spacing: -0.01em;
}
.twin-suggestions button:hover {
  background: rgba(212,162,86,0.12);
  border-color: rgba(212,162,86,0.4);
  transform: translateX(3px);
}
html[data-theme="light"] .twin-suggestions button {
  background: rgba(212,162,86,0.06);
  border-color: rgba(212,162,86,0.25);
}
.twin-chat {
  display: flex; flex-direction: column;
  min-height: 560px;
}
.twin-messages {
  flex: 1;
  padding: 32px 36px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  max-height: 460px;
}
.twin-messages::-webkit-scrollbar { width: 4px; }
.twin-messages::-webkit-scrollbar-thumb { background: rgba(212,162,86,0.25); border-radius: 4px; }
.twin-empty {
  margin: auto;
  text-align: center;
  color: var(--fg-3);
  max-width: 36ch;
  padding: 40px 0;
}
.twin-empty .pulse-icon {
  width: 56px; height: 56px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,162,86,0.4), transparent 70%);
  position: relative;
  animation: twin-breathe 3s ease-in-out infinite;
}
.twin-empty .pulse-icon::before,
.twin-empty .pulse-icon::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: 0;
  animation: twin-ripple 3s ease-out infinite;
}
.twin-empty .pulse-icon::after { animation-delay: 1.5s; }
@keyframes twin-breathe {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.1); opacity: 1; }
}
@keyframes twin-ripple {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(2.4); opacity: 0; }
}
.twin-empty h4 {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 22px;
  color: var(--fg);
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}
.twin-empty p {
  font-size: 14px; line-height: 1.55;
}
.twin-msg {
  display: flex; gap: 14px;
  animation: twin-msg-in .4s var(--ease-out) both;
}
@keyframes twin-msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.twin-msg .avatar {
  flex: none;
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.1em;
  font-weight: 600;
}
.twin-msg.user .avatar {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--line-2);
  color: var(--fg-2);
}
.twin-msg.twin .avatar {
  background: radial-gradient(circle at 30% 30%, rgba(232,192,125,0.9), rgba(180,130,60,0.7));
  color: #1a0f06;
  box-shadow: 0 0 16px rgba(212,162,86,0.3);
}
html[data-theme="light"] .twin-msg.user .avatar {
  background: rgba(0,0,0,0.04);
  color: var(--fg-2);
}
.twin-msg .bubble {
  flex: 1;
  padding: 2px 0;
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
  letter-spacing: -0.005em;
  text-wrap: pretty;
}
.twin-msg .bubble .sender {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 6px;
}
.twin-msg.twin .bubble .sender {
  color: var(--accent-2);
}
.twin-thinking {
  display: inline-flex; gap: 4px;
  align-items: center;
  padding: 6px 0;
}
.twin-thinking span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  opacity: 0.5;
  animation: twin-dots 1.2s ease-in-out infinite;
}
.twin-thinking span:nth-child(2) { animation-delay: 0.2s; }
.twin-thinking span:nth-child(3) { animation-delay: 0.4s; }
@keyframes twin-dots {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}
.twin-input-bar {
  border-top: 1px solid rgba(212,162,86,0.15);
  padding: 18px 20px 18px 28px;
  display: flex; align-items: center; gap: 12px;
  background: rgba(0,0,0,0.2);
}
html[data-theme="light"] .twin-input-bar {
  border-top-color: rgba(0,0,0,0.08);
  background: rgba(0,0,0,0.015);
}
.twin-input-bar input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  padding: 8px 0;
  letter-spacing: -0.01em;
}
.twin-input-bar input::placeholder { color: var(--fg-3); }
.twin-send {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent);
  color: #0a0804;
  border: none;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .25s var(--ease);
  box-shadow: 0 0 0 1px rgba(212,162,86,0.4), 0 4px 16px rgba(212,162,86,0.3);
}
.twin-send:hover:not(:disabled) {
  transform: scale(1.06);
  box-shadow: 0 0 0 1px rgba(212,162,86,0.6), 0 6px 22px rgba(212,162,86,0.5);
}
.twin-send:disabled {
  opacity: 0.35; cursor: not-allowed;
  box-shadow: none;
}
.twin-footer-note {
  text-align: center;
  margin-top: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
}

@media (max-width: 900px) {
  .twin-panel {
    grid-template-columns: 1fr;
    min-height: 0;
  }
  .twin-side {
    border-right: none;
    border-bottom: 1px solid rgba(212,162,86,0.15);
  }
  html[data-theme="light"] .twin-side {
    border-bottom-color: rgba(0,0,0,0.08);
  }
  .twin-chat { min-height: 440px; }
}

/* ============ AI TWIN FLOATING FAB + DRAWER ============ */
.twin-fab {
  position: fixed;
  bottom: 28px; right: 28px;
  z-index: 9000;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 12px 20px 12px 14px;
  background: linear-gradient(135deg, rgba(20,16,12,0.96), rgba(8,6,4,0.96));
  border: 1px solid rgba(212,162,86,0.35);
  border-radius: 999px;
  cursor: pointer;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.3),
    0 20px 60px rgba(0,0,0,0.5),
    0 0 0 1px rgba(212,162,86,0.08),
    inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  transition: transform .4s var(--ease), box-shadow .4s var(--ease), opacity .3s var(--ease);
  animation: twin-fab-enter 0.7s var(--ease-out) 1.2s both;
}
@keyframes twin-fab-enter {
  from { opacity: 0; transform: translateY(24px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.twin-fab:hover {
  transform: translateY(-3px);
  box-shadow:
    0 4px 10px rgba(0,0,0,0.35),
    0 30px 80px rgba(212,162,86,0.25),
    0 0 0 1px rgba(212,162,86,0.4),
    inset 0 1px 0 rgba(255,255,255,0.08);
}
.twin-fab.is-open { opacity: 0; pointer-events: none; transform: scale(0.85); }
html[data-theme="light"] .twin-fab {
  background: linear-gradient(135deg, #fff, #fafafa);
  border-color: rgba(180,130,45,0.35);
  box-shadow:
    0 2px 6px rgba(0,0,0,0.06),
    0 20px 60px rgba(0,0,0,0.1),
    inset 0 1px 0 rgba(255,255,255,0.8);
}
html[data-theme="light"] .twin-fab .fab-sub { color: #6a6a72; }

.twin-fab-orb {
  position: relative;
  width: 36px; height: 36px;
  flex: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.twin-fab-orb.sm { width: 28px; height: 28px; }
.twin-fab-orb .orb-core {
  width: 12px; height: 12px; border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, #ffd89a, var(--accent) 60%, #8a5a1a 100%);
  box-shadow:
    0 0 18px var(--accent),
    0 0 4px var(--accent),
    inset 0 1px 2px rgba(255,220,170,0.8);
  animation: twin-orb-breath 2.5s ease-in-out infinite;
}
.twin-fab-orb.sm .orb-core { width: 10px; height: 10px; }
@keyframes twin-orb-breath {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.9); opacity: 0.85; }
}
.twin-fab-orb .orb-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: 0;
  animation: twin-orb-ripple 3s ease-out infinite;
}
.twin-fab-orb .orb-ring-2 { animation-delay: 1.5s; }
@keyframes twin-orb-ripple {
  0% { transform: scale(0.4); opacity: 0.9; }
  100% { transform: scale(1.5); opacity: 0; }
}
.twin-fab-label {
  display: flex; flex-direction: column;
  line-height: 1.15;
  text-align: left;
  letter-spacing: -0.01em;
}
.twin-fab-label .fab-title {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 16px;
  color: var(--fg);
  letter-spacing: -0.015em;
}
.twin-fab-label .fab-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-top: 3px;
}

.twin-fab.pulse {
  animation: twin-fab-enter 0.7s var(--ease-out) both, twin-fab-pulse 2.4s ease-in-out 1.2s 3;
}
@keyframes twin-fab-pulse {
  0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,162,86,0.08); }
  50% { box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 20px 60px rgba(0,0,0,0.5), 0 0 0 6px rgba(212,162,86,0.18); }

.twin-scrim {

  background: rgba(0,0,0,0.55);

  opacity: 0;

.twin-scrim.is-open { opacity: 1; pointer-events: auto; }
html[data-theme="light"] .twin-scrim { background: rgba(30,22,10,0.35); }

.twin-drawer-who {

.twin-drawer-meta .name .live {

/* ============ HERO V2 — portrait + bigger headline ============ */
.hero-v2 {
  min-height: auto !important;
  height: auto !important;
  align-items: center !important;
  padding: 0 !important;
}
@media (min-width: 961px) {
  .hero-v2 { min-height: 100vh !important; }
}
.hero-v2 .fx-grid { display: none !important; }
.hero-v2 .fx-network-off, .hero-v2 .fx-particles-off { display: none !important; }
.hero-v2 .fx-scan { opacity: 0.25; }
.hero-v2 .fx-circuit-mute { opacity: 0.35; }
.hero-v2 .fx-photo { opacity: 0.38; filter: saturate(0.85) contrast(1.05) brightness(0.7); }
html[data-theme="light"] .hero-v2 .fx-photo { opacity: 0.2; filter: saturate(0.7) brightness(1.05); }

.hero-content-v2 {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.9fr);
  gap: clamp(40px, 6vw, 96px);
  align-items: center;
  width: min(1440px, calc(100% - 80px));
  margin: 0 auto;
  padding: clamp(60px, 9vh, 140px) 0 clamp(80px, 10vh, 160px);
  position: relative;
  z-index: 2;
}
.hero-v2 .hero-lead { min-width: 0; }
.hero-v2 .eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
}
.hero-v2 .eyebrow .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}
.hero-v2 .hero-headline {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: clamp(56px, 11vw, 200px) !important;
  line-height: 0.92 !important;
  letter-spacing: -0.045em !important;
  margin: 0 0 36px !important;
  max-width: 12ch !important;
  color: var(--fg);
}
.hero-v2 .hero-headline em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
  font-variation-settings: "opsz" 144;
}
.hero-v2 .hero-lede {
  font-family: 'Inter', sans-serif;
  font-size: clamp(17px, 1.5vw, 21px);
  line-height: 1.55;
  color: rgba(245, 245, 247, 0.78);
  max-width: 52ch;
  margin: 0 0 40px;
  letter-spacing: -0.005em;
}
html[data-theme="light"] .hero-v2 .hero-lede { color: rgba(10, 10, 10, 0.7); }

.hero-v2 .hero-meta {
  display: flex; flex-wrap: wrap; gap: 14px;
  margin-bottom: 28px;
}
.hero-v2 .hero-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.hero-v2 .hero-foot .pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border: 1px solid rgba(94, 207, 137, 0.3);
  border-radius: 999px;
  background: rgba(94, 207, 137, 0.06);
  color: #5ecf89;
  font-size: 10.5px;
}
.hero-v2 .hero-foot .live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #5ecf89;
  box-shadow: 0 0 8px #5ecf89;
  animation: hv2-pulse 2s ease-in-out infinite;
}
@keyframes hv2-pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}
.hero-v2 .hero-foot .hero-location {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--fg-3);
}
.hero-v2 .hero-foot .globe {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1px solid currentColor;
  opacity: 0.6;
}

/* Portrait */
.hero-portrait {
  position: relative;
  justify-self: end;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 4/5;
}
.portrait-frame {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 4px;
  overflow: hidden;
  background: #0a0806;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.4),
    0 40px 100px rgba(0,0,0,0.55),
    0 0 0 1px rgba(212, 162, 86, 0.25),
    inset 0 0 0 1px rgba(255,255,255,0.04);
}
.portrait-img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 20%;
  filter: grayscale(0.15) contrast(1.02);
  transition: filter 0.8s var(--ease), transform 1.2s var(--ease);
}
.portrait-frame:hover .portrait-img {
  filter: grayscale(0) contrast(1);
  transform: scale(1.02);
}
/* Subtle amber tint overlay */
.portrait-frame::after {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, transparent 40%, rgba(8,6,4,0.92) 100%),
    radial-gradient(ellipse at 30% 20%, rgba(212,162,86,0.12), transparent 60%);
  pointer-events: none;
}
/* Corner brackets */
.portrait-corners { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.portrait-corners .pc {
  position: absolute;
  width: 22px; height: 22px;
  border: 1.5px solid var(--accent);
}
.portrait-corners .pc.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
.portrait-corners .pc.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
.portrait-corners .pc.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
.portrait-corners .pc.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

.portrait-caption {
  position: absolute;
  left: 18px; right: 18px; bottom: 18px;
  z-index: 4;
  display: flex; flex-direction: column; gap: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.portrait-caption .pc-row {
  display: flex; gap: 10px; align-items: baseline;
}
.portrait-caption .pc-k {
  color: var(--accent);
  min-width: 52px;
  opacity: 0.85;
}
.portrait-caption .pc-v {
  color: rgba(245,245,247,0.92);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.02em;
  text-transform: none;
  font-weight: 450;
}
.portrait-badge {
  position: absolute;
  top: -14px; right: -14px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #a87636);
  color: #0a0804;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 24px;
  letter-spacing: -0.02em;
  z-index: 5;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.3),
    0 0 0 1px rgba(212,162,86,0.4),
    0 0 24px rgba(212,162,86,0.3);
  animation: hv2-badge 4s ease-in-out infinite;
}
@keyframes hv2-badge {
  0%,100% { transform: scale(1); box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 0 0 1px rgba(212,162,86,0.4), 0 0 24px rgba(212,162,86,0.3); }
  50% { transform: scale(1.04); box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 0 0 1px rgba(212,162,86,0.55), 0 0 40px rgba(212,162,86,0.45); }
}

/* Scroll cue positioning */
.hero-v2 .scroll-cue { bottom: 28px; }

/* Responsive */
@media (max-width: 960px) {
  .hero-content-v2 {
    grid-template-columns: 1fr;
    gap: 48px;
    width: min(720px, calc(100% - 48px));
    padding: clamp(80px, 14vh, 140px) 0 80px;
  }
  .hero-v2 .hero-headline {
    font-size: clamp(52px, 14vw, 120px) !important;
  }
  .hero-portrait {
    max-width: 320px;
    justify-self: center;
    order: -1;
  }
}
@media (max-width: 520px) {
  .hero-v2 .hero-headline { font-size: clamp(48px, 16vw, 92px) !important; }
  .hero-portrait { max-width: 260px; }
  .portrait-caption { font-size: 8.5px; }
  .portrait-caption .pc-k { min-width: 42px; }
}

/* ============ SCROLL PROGRESS INDICATOR ============ */
.scroll-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 12px var(--accent), 0 0 2px var(--accent);
  z-index: 10000;
  transition: width .1s linear;
  pointer-events: none;
}

/* ============ RESULTS TICKER ============ */
.results-ticker {
  width: 100%;
  overflow: hidden;
  border-top: 1px solid rgba(212,162,86,0.16);
  border-bottom: 1px solid rgba(212,162,86,0.16);
  background: rgba(212,162,86,0.03);
  margin: 48px 0 64px;
  padding: 22px 0;
  position: relative;
}
html[data-theme="light"] .results-ticker {
  border-color: rgba(180,130,45,0.18);
  background: rgba(212,162,86,0.04);
}
.results-ticker::before, .results-ticker::after {
  content: '';
  position: absolute; top: 0; bottom: 0;
  width: 120px;
  z-index: 2;
  pointer-events: none;
}
.results-ticker::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
.results-ticker::after { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }

.results-track {
  display: inline-flex;
  gap: 72px;
  white-space: nowrap;
  animation: ticker-scroll 45s linear infinite;
  padding-left: 72px;
}
.results-ticker:hover .results-track { animation-play-state: paused; }
@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.ticker-item {
  display: inline-flex; align-items: baseline; gap: 14px;
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.01em;
}
.ticker-num {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: 28px;
  color: var(--accent);
  letter-spacing: -0.025em;
}
.ticker-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.ticker-sep {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  opacity: 0.5;
  align-self: center;
}

.atlas-v3-head .accent { color: var(--accent-2); }
.atlas-map-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 784 / 458;
  max-width: 1200px;
  margin: 0 auto;
}
.atlas-map {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  /* The map SVG is solid black. Recolor via filter for dark/light. */
  /* Dark: muted amber stroke; Light: deep neutral */
  filter:
    brightness(0) saturate(100%)
    invert(74%) sepia(33%) saturate(420%) hue-rotate(347deg) brightness(86%) contrast(85%)
    opacity(0.55);
  pointer-events: none;
  user-select: none;
}
html[data-theme="light"] .atlas-map {
  filter:
    brightness(0) saturate(100%)
    invert(20%) sepia(10%) saturate(400%) hue-rotate(340deg) brightness(95%) contrast(90%)
    opacity(0.45);
}
.atlas-map-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(212,162,86,0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(212,162,86,0.05) 1px, transparent 1px);
  background-size: 8.33% 12.5%; /* 12 cols × 8 rows */
  pointer-events: none;
}
html[data-theme="light"] .atlas-map-grid {
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
}
.atlas-pin {
  position: absolute;
  width: 14px; height: 14px;
  margin-left: -7px; margin-top: -7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(212,162,86,0.18), 0 0 18px rgba(212,162,86,0.55);
  cursor: pointer;
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
  z-index: 3;
}
.atlas-pin::after {
  content: ""; position: absolute; inset: -10px;
  border-radius: 50%; border: 1px solid var(--accent);
  opacity: 0.55;
  animation: atlasPulse 2.4s ease-out infinite;
}
.atlas-pin:hover { transform: scale(1.25); box-shadow: 0 0 0 6px rgba(212,162,86,0.22), 0 0 26px rgba(212,162,86,0.75); }
.atlas-pin.is-active { transform: scale(1.4); }
.atlas-pin.is-active::after { animation-duration: 1.4s; opacity: 0.9; }
@keyframes atlasPulse {
  0%   { transform: scale(0.7); opacity: 0.7; }
  100% { transform: scale(2.4); opacity: 0; }
}
.atlas-pin-label {
  position: absolute;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--fg-2);
  padding: 3px 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  opacity: 0;
  transition: opacity .25s var(--ease);
  pointer-events: none;
}
.atlas-pin:hover .atlas-pin-label,
.atlas-pin.is-active .atlas-pin-label { opacity: 1; }

.atlas-card {
  margin-top: 48px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  align-items: stretch;
  position: relative;
  z-index: 2;
}
.atlas-card-img {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg-2);
}
.atlas-card-img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity .6s var(--ease);
}
.atlas-card-img .frame-num {
  position: absolute; top: 16px; left: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em;
  color: rgba(245,245,247,0.85);
  background: rgba(0,0,0,0.45);
  padding: 4px 10px; border-radius: 4px;
  backdrop-filter: blur(8px);
}
.atlas-card-meta { display: flex; flex-direction: column; justify-content: space-between; padding: 8px 0; }
.atlas-card-cat {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent-2); font-weight: 500; margin-bottom: 12px;
}
.atlas-card-title {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: clamp(28px, 3.2vw, 44px);
  line-height: 1.1; letter-spacing: -0.025em;

}
.atlas-card-place {
  font-family: 'JetBrains Mono', monospace;

}
.atlas-card-coords { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--fg-3); margin-bottom: 24px; }
.atlas-card-nav { display: flex; gap: 10px; align-items: center; }
.atlas-card-nav button {
  width: 36px; height: 36px; border-radius: 50%;
  background: transparent; color: var(--fg);
  border: 1px solid var(--line-2);
  cursor: pointer; font-size: 16px; line-height: 1;
  transition: border-color .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
}
.atlas-card-nav button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.atlas-card-counter {
  margin-left: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.18em; color: var(--fg-3);
}
.atlas-attrib {
  margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-3); text-align: right;
  position: relative; z-index: 2;
}
.atlas-attrib a { color: var(--fg-2); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.atlas-attrib a:hover { color: var(--accent); }

@media (max-width: 800px) {
  .atlas-v3 { padding: 40px 20px 28px; }
  .atlas-card { grid-template-columns: 1fr; gap: 24px; }
  .atlas-pin { width: 12px; height: 12px; margin-left: -6px; margin-top: -6px; }
}

</style>

<div id="splash" class="splash">

      </svg>
    </span>
    <div class="mark">Azlan<span class="dot">.</span></div>
    <div class="bar"></div>
  </div>
</div>

<div class="page-fade" id="page-fade"></div>

<div id="root"></div>

<script>
// ===== Theme =====
(function () {
  const root = document.documentElement;
  const saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  window.toggleTheme = function () {
    const cur = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = cur === 'light' ? 'dark' : 'light';
    if (next === 'dark') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', next);
    const icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☾' : '☀';
  };
  // Surface (default → glass → liquid → default)
  const savedSurface = localStorage.getItem('surface');
  if (savedSurface === 'glass' || savedSurface === 'liquid') root.setAttribute('data-surface', savedSurface);
  const surfaceIcons = { default: '○', glass: '◉', liquid: '◈' };
  const surfaceLabels = { default: 'Flat', glass: 'Liquid Glass', liquid: 'Liquid Metal' };
  const surfaceOrder = ['default', 'glass', 'liquid'];
  window.toggleSurface = function () {
    const cur = root.getAttribute('data-surface') || 'default';
    const idx = surfaceOrder.indexOf(cur);
    const next = surfaceOrder[(idx + 1) % surfaceOrder.length];
    if (next === 'default') root.removeAttribute('data-surface'); else root.setAttribute('data-surface', next);
    localStorage.setItem('surface', next);
    const ic = document.getElementById('surface-icon');
    if (ic) ic.textContent = surfaceIcons[next];
    const btn = document.getElementById('surface-btn');
    if (btn) {
      btn.setAttribute('aria-pressed', String(next !== 'default'));
      btn.setAttribute('title', `Surface: ${surfaceLabels[next]}`);
      btn.setAttribute('data-surface-mode', next);
    }
  };
})();

// ===== Splash =====
window.addEventListener('load', () => {
  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) s.classList.add('gone');
  }, 900);
});

// ===== Reveal on scroll =====
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

function bindReveals() {
  document.querySelectorAll('.reveal:not(.in)').forEach(el => {
    // Immediate check: if already in viewport, reveal right away.
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (r.top < vh - 40 && r.bottom > 0) {
      el.classList.add('in');
    } else {
      io.observe(el);
    }
  });
}
window.bindReveals = bindReveals;

// ===== Magnetic buttons =====
function bindMagnets() {
  document.querySelectorAll('[data-magnet]').forEach(el => {
    if (el._magnetBound) return;
    el._magnetBound = true;
    const strength = parseFloat(el.dataset.magnet) || 0.25;
    el.addEventListener('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      const x = e.clientX - (r.left + r.width / 2);
      const y = e.clientY - (r.top + r.height / 2);
      el.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
    });
    el.addEventListener('mouseleave', () => { el.style.transform = ''; });
  });
}
window.bindMagnets = bindMagnets;

// ===== Spotlight on cards =====
function bindSpotlight() {
  document.querySelectorAll('[data-spotlight]').forEach(card => {
    if (card._spotBound) return;
    card._spotBound = true;
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - r.left}px`);
      card.style.setProperty('--my', `${e.clientY - r.top}px`);
    });
  });
}
window.bindSpotlight = bindSpotlight;

// ===== Parallax =====
function bindParallax() {
  const els = document.querySelectorAll('[data-parallax]');
  if (!els.length) return;
  let ticking = false;
  function update() {
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      const speed = parseFloat(el.dataset.parallax) || 0.15;
      const offset = (window.innerHeight / 2 - (r.top + r.height / 2)) * speed;
      el.style.transform = `translate3d(0, ${offset}px, 0)`;
    });
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  update();
}
window.bindParallax = bindParallax;

// ===== Page fade for nav links =====
function bindPageFade() {
  const fade = document.getElementById('page-fade');
  document.querySelectorAll('[data-fade-link]').forEach(a => {
    a.addEventListener('click', (e) => {
      const href = a.getAttribute('href') || '';
      if (!href || href.startsWith('#')) return;
      e.preventDefault();
      fade.classList.add('show');
      setTimeout(() => { window.location.href = href; }, 420);
    });
  });
}
window.bindPageFade = bindPageFade;

// ===== Mount hook =====
window.afterMount = function () {
  bindReveals();
  bindMagnets();
  bindSpotlight();
  bindParallax();
  bindPageFade();
  bindHeroGlow();
  bindHeroNetwork();
  bindScrollSpy();
  bindCountUp();
  bindScrollProgress();
};

// ===== Scroll progress bar =====
function bindScrollProgress() {
  const bar = document.getElementById('scroll-progress');
  if (!bar) return;
  let ticking = false;
  function update() {
    const h = document.documentElement;
    const total = h.scrollHeight - h.clientHeight;
    const pct = total > 0 ? (h.scrollTop / total) * 100 : 0;
    bar.style.width = pct + '%';
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  update();
}
window.bindScrollProgress = bindScrollProgress;

// ===== Scroll-spy =====
function bindScrollSpy() {
  const links = document.querySelectorAll('.nav-links a[data-spy]');
  if (!links.length) return;
  const map = {};
  links.forEach(a => {
    const id = a.dataset.spy;
    const sec = document.getElementById(id);
    if (sec) map[id] = { a, sec };
  });
  const spyIO = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      const id = e.target.id;
      if (!map[id]) return;
      if (e.isIntersecting) {
        Object.values(map).forEach(m => m.a.classList.remove('active'));
        map[id].a.classList.add('active');
      }
    });
  }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  Object.values(map).forEach(m => spyIO.observe(m.sec));
}

// ===== Count-up stats =====
function bindCountUp() {
  const els = document.querySelectorAll('[data-count-to]:not(.counted)');
  if (!els.length) return;
  const cuIO = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target;
      el.classList.add('counted');
      const to = parseInt(el.dataset.countTo, 10) || 0;
      const suf = el.dataset.countSuffix || '';
      const dur = 1400;
      const start = performance.now();
      const easeOut = t => 1 - Math.pow(1 - t, 3);
      function tick(now) {
        const t = Math.min(1, (now - start) / dur);
        const val = Math.round(to * easeOut(t));
        el.textContent = val + suf;
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      cuIO.unobserve(el);
    });
  }, { threshold: 0.4 });
  els.forEach(el => cuIO.observe(el));
}

// ===== Hero accent glow follows cursor =====
function bindHeroGlow() {
  const hero = document.querySelector('.hero');
  const glow = document.getElementById('heroGlow');
  if (!hero || !glow || hero._glowBound) return;
  hero._glowBound = true;
  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 100;
    const y = ((e.clientY - r.top) / r.height) * 100;
    glow.style.setProperty('--mx', x + '%');
    glow.style.setProperty('--my', y + '%');
  });
}

// ===== Hero network canvas — floating nodes + connections =====
function bindHeroNetwork() {
  const canvas = document.getElementById('hero-net');
  if (!canvas || canvas._netBound) return;
  canvas._netBound = true;
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0, nodes = [], mouse = { x: -9999, y: -9999 };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    w = rect.width; h = rect.height;
    canvas.width = w * DPR; canvas.height = h * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const density = Math.min(90, Math.max(40, Math.floor((w * h) / 22000)));
    nodes = Array.from({ length: density }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.28,
      vy: (Math.random() - 0.5) * 0.28,
      r: Math.random() * 1.6 + 0.6,
    }));
  }
  resize();
  window.addEventListener('resize', resize);
  canvas.parentElement.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  canvas.parentElement.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  const light = () => document.documentElement.getAttribute('data-theme') === 'light';

  function tick() {
    ctx.clearRect(0, 0, w, h);
    // update
    for (const n of nodes) {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
      // slight attraction to cursor
      const dx = mouse.x - n.x, dy = mouse.y - n.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 200 * 200) {
        const f = (1 - Math.sqrt(d2) / 200) * 0.12;
        n.vx += (dx / Math.sqrt(d2 + 1)) * f;
        n.vy += (dy / Math.sqrt(d2 + 1)) * f;
      }
      // damping
      n.vx *= 0.985; n.vy *= 0.985;
      // never fully stop
      if (Math.abs(n.vx) < 0.05) n.vx += (Math.random() - 0.5) * 0.05;
      if (Math.abs(n.vy) < 0.05) n.vy += (Math.random() - 0.5) * 0.05;
    }

    // connections
    const linkDist = 150;
    const isLight = light();
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < linkDist) {
          const alpha = (1 - d / linkDist) * 0.45;
          ctx.strokeStyle = isLight
            ? `rgba(147,100,25,${alpha * 0.9})`
            : `rgba(232,192,125,${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // nodes
    for (const n of nodes) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = isLight ? 'rgba(147,100,25,0.85)' : 'rgba(255,220,160,0.9)';
      ctx.shadowColor = isLight ? 'rgba(176,122,44,0.7)' : 'rgba(232,192,125,0.9)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // cursor-following connections
    if (mouse.x > -9999) {
      for (const n of nodes) {
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 180) {
          const alpha = (1 - d / 180) * 0.85;
          ctx.strokeStyle = isLight
            ? `rgba(147,100,25,${alpha})`
            : `rgba(255,220,160,${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(n.x, n.y);
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

</script>

<script type="text/babel" data-presets="react">
// ============== LOGO MARK ==============
const LogoMark = ({ className = '' }) => (
  <span className={`logo-mark ${className}`} aria-hidden="true">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle className="core" cx="20" cy="20" r="18" />
      <circle className="ring-outer" cx="20" cy="20" r="18.5" />
      <path className="ring-inner" d="M20 3 L37 20 L20 37 L3 20 Z" />
      <path className="glyph-a" d="M11 29 L20 10 L29 29" />
      <path className="glyph-bar" d="M14.2 22.5 L25.8 22.5" />
      <circle className="spark" cx="33" cy="31" r="1.8" />
    </svg>
  </span>
);
window.LogoMark = LogoMark;

// ============== NAV ==============
const Nav = () => (
  <nav className="nav" id="nav">
    <div className="nav-inner">
      <a href="#" className="nav-brand"><LogoMark/>Azlan<span className="dot">.</span></a>
      <div className="nav-links">
        <a href="#salesforce" data-spy="salesforce">Salesforce</a>
        <a href="#ai" data-spy="ai">AI Lab</a>
        <a href="#photo" data-spy="photo">Photography</a>
        <a href="#notes" data-spy="notes">Field Notes</a>
        <a className="nav-resume" href="#" onClick={(e)=>{e.preventDefault(); alert('Resume PDF, add the file to your project.');}} title="Download Resume"><span className="dl">↓</span>Resume</a>
        <a className="nav-cta nav-cta-book" data-magnet="0.2" href="#contact">Book a call <span className="arrow">→</span></a>
        <button id="surface-btn" className="theme-toggle" onClick={() => window.toggleSurface()} aria-label="Cycle surface: flat / glass / metal" title="Surface: Flat">
          <span id="surface-icon">○</span>
        </button>
        <button className="theme-toggle" onClick={() => window.toggleTheme()} aria-label="Toggle theme">
          <span id="theme-icon">☀</span>
        </button>
      </div>
    </div>
  </nav>
);

// ============== HERO ==============
const Hero = () => (
  <section className="hero hero-v2" id="hero">
    {/* Ambient photo echo */}
    <div className="fx fx-photo"></div>

    {/* Circuit traces (kept subtle) */}
    <div className="fx fx-circuit fx-circuit-mute" aria-hidden="true">
      <svg viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="rgba(232,192,125,0)"/>
            <stop offset="50%" stopColor="rgba(232,192,125,0.9)"/>

          onMouseLeave={() => setPaused(false)}
        >
          <div className="atlas-v3-head">
            <span><span className="accent">●</span> AZLOZA · LIGHT ATLAS</span>
            <span>N · S · E · W</span>
          </div>

          <div className="atlas-map-wrap">
            <img className="atlas-map" src="assets/world-map.svg" alt="World map" />

            {frames.map((f, i) => (

                key={i}
                className={`atlas-pin ${i === active ? 'is-active' : ''}`}
                style={{ left: f.x + '%', top: f.y + '%' }}
                onClick={() => setActive(i)}
                title={f.place}
              >
                <span className="atlas-pin-label">{f.place}</span>
              </div>
            ))}
          </div>

          <div className="atlas-card">
            <div className="atlas-card-img">
              <img src={a.img} alt={a.title} key={a.img} />
              <div className="frame-num">{String(active+1).padStart(2,'0')} · {a.year}</div>
            </div>
            <div className="atlas-card-meta">
              <div>
                <div className="atlas-card-cat">{a.cat}</div>
                <div className="atlas-card-title">{a.title}</div>
                <div className="atlas-card-place">{a.place}</div>
                <div className="atlas-card-coords">{a.coords}</div>
              </div>
              <div className="atlas-card-nav">
                <button onClick={prev} aria-label="Previous">←</button>
                <button onClick={next} aria-label="Next">→</button>
                <span className="atlas-card-counter">{String(active+1).padStart(2,'0')} / {String(frames.length).padStart(2,'0')}</span>
              </div>
            </div>
          </div>

          <div className="atlas-attrib">
            Map · <a href="https://github.com/flekschas/simple-world-map" target="_blank" rel="noopener noreferrer">simple-world-map</a> by Fritz Lekschas · CC BY-SA 3.0

          <a className="text-link" href="#" style={{fontSize:14}}>View full gallery @azloza →</a>
        </div>

    </section>
  );
};

const TWIN_SYSTEM = `You are an AI twin of Azlan Azloza, a Salesforce Architect and AI Builder with ten years of experience. You speak in Azlan's voice: plain, direct, confident but never boastful, occasionally dry. You prefer concrete examples over abstractions.

Your background:
- Ten years designing enterprise Salesforce platforms for clients including Yellowstone Club, a US government agency, Town of Cary NC (Agentforce), a 100 year old private athletic club, and currently a US state tourism authority
- Current engagement: enhancing a state tourism authority's grants management system and launching an Experience Cloud destination for travel experiences on the same org
- Recent flagship: deployed Salesforce Agentforce for Town of Cary, resolving 40% of citizen service requests autonomously and cutting resolution time 58%
- AI practice: agentic workflow orchestrators, RAG code assistants, fine tuning on domain documents, LLM eval harnesses
- Also a photographer publishing as Azloza, focused on travel, architecture, and light. Shoots in Istanbul, Kuala Lumpur, Singapore, Kyoto, Lisbon
- Philosophy: the architecture review is really a stakeholder review, ship the ugly slice in week two, runbooks are love letters to the team that inherits you

Rules:
- Answer in first person as Azlan
- Keep responses tight, 2 to 4 sentences unless the question truly demands depth
- Never invent specific client numbers, employee counts, contract values, or private details you were not given. If asked, deflect honestly: say you keep client specifics off the record
- If asked for contact, point people to the Contact section of the site
- Never use em dashes. Use commas, colons, or periods instead
- If asked something unrelated to work, photography, or Azlan, politely redirect
`;

const TWIN_SUGGESTIONS = [
  "What's the hardest part of a Salesforce rebuild?",
  "How do you earn trust with a new client?",
  "What's your take on Agentforce?",
  "How do Salesforce and photography connect for you?",
  "What are you working on right now?",
];

const AITwinFloat = () => {
  const [open, setOpen] = React.useState(false);
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [hasPulsed, setHasPulsed] = React.useState(false);
  const scrollRef = React.useRef(null);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages, loading, open]);

  React.useEffect(() => {
    if (open && inputRef.current) {
      setTimeout(() => inputRef.current?.focus(), 400);
    }
  }, [open]);

  // Pulse attention once after 8s if user hasn't opened it
  React.useEffect(() => {
    const t = setTimeout(() => { if (!open) setHasPulsed(true); }, 8000);
    return () => clearTimeout(t);
  }, [open]);

  const send = async (text) => {
    const q = (text || input).trim();
    if (!q || loading) return;
    const nextMsgs = [...messages, { role: 'user', content: q }];
    setMessages(nextMsgs);
    setInput('');
    setLoading(true);
    try {
      const history = nextMsgs.map(m => ({
        role: m.role === 'twin' ? 'assistant' : 'user',
        content: m.content,
      }));
      const reply = await window.claude.complete({
        system: TWIN_SYSTEM,
        messages: history,
      });
      setMessages(m => [...m, { role: 'twin', content: (reply || '').trim() || 'Hmm, got nothing back. Try again?' }]);
    } catch (err) {
      setMessages(m => [...m, { role: 'twin', content: "Twin is offline for a second. Try again in a moment, or drop a note in the Contact section." }]);
    } finally {
      setLoading(false);
    }
  };

  const onKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };

  const openPanel = () => { setOpen(true); setHasPulsed(false); };
  const closePanel = () => setOpen(false);
  const resetChat = () => { setMessages([]); setInput(''); };

  return (
    <>
      <button
        className={`twin-fab ${open ? 'is-open' : ''} ${hasPulsed && !open ? 'pulse' : ''}`}
        onClick={open ? closePanel : openPanel}
        aria-label={open ? 'Close Azlan AI Twin' : 'Open Azlan AI Twin'}
      >
        <span className="twin-fab-orb" aria-hidden="true">
          <span className="orb-core"></span>
          <span className="orb-ring"></span>
          <span className="orb-ring orb-ring-2"></span>
        </span>
        <span className="twin-fab-label">
          <span className="fab-title">Ask Azlan</span>
          <span className="fab-sub">Chat · live</span>
        </span>
      </button>

      <div className={`twin-drawer ${open ? 'is-open' : ''}`} role="dialog" aria-modal="true" aria-hidden={!open}>
        <div className="twin-drawer-header">
          <div className="twin-drawer-who">
            <span className="twin-fab-orb sm" aria-hidden="true">
              <span className="orb-core"></span>
              <span className="orb-ring"></span>
            </span>
            <div className="twin-drawer-meta">
              <div className="name">Azlan AI Twin <span className="live">● live</span></div>
              <div className="role">Trained on my voice & ten years of work</div>
            </div>
          </div>
          <div className="twin-drawer-actions">
            {messages.length > 0 && (
              <button className="twin-icon-btn" onClick={resetChat} title="New chat" aria-label="New chat">↻</button>
            )}
            <button className="twin-icon-btn" onClick={closePanel} title="Close" aria-label="Close">✕</button>
          </div>
        </div>

        <div className="twin-drawer-messages" ref={scrollRef}>
          {messages.length === 0 && !loading && (
            <div className="twin-drawer-empty">
              <div className="empty-orb" aria-hidden="true">
                <span className="orb-core"></span>
                <span className="orb-ring"></span>
                <span className="orb-ring orb-ring-2"></span>
              </div>
              <h4>How can I help?</h4>
              <p>Ask about Salesforce architecture, how I work with clients, my current project, or my photography.</p>
              <div className="twin-drawer-suggestions">
                {TWIN_SUGGESTIONS.map((s, i) => (
                  <button key={i} onClick={() => send(s)}>{s}</button>
                ))}
              </div>
            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} className={`twin-msg ${m.role}`}>
              <div className="avatar">{m.role === 'twin' ? 'AA' : 'U'}</div>
              <div className="bubble">
                <span className="sender">{m.role === 'twin' ? 'Azlan (Twin)' : 'You'}</span>
                {m.content}
              </div>
            </div>
          ))}
          {loading && (
            <div className="twin-msg twin">
              <div className="avatar">AA</div>
              <div className="bubble">
                <span className="sender">Azlan (Twin)</span>
                <div className="twin-thinking"><span></span><span></span><span></span></div>
              </div>
            </div>
          )}
        </div>

        <div className="twin-drawer-input">
          <input
            ref={inputRef}
            type="text"
            placeholder="Ask the twin anything..."
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={onKey}
            disabled={loading}
          />
          <button className="twin-send" onClick={() => send()} disabled={loading || !input.trim()} aria-label="Send">→</button>
        </div>

        <div className="twin-drawer-footer">Responses generated on the fly</div>
      </div>

      <div className={`twin-scrim ${open ? 'is-open' : ''}`} onClick={closePanel} aria-hidden="true"></div>
    </>
  );
};
window.AITwinFloat = AITwinFloat;
